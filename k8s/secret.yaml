apiVersion: v1
kind: Secret
metadata:
  name: tenantflow-secrets
  namespace: tenantflow
type: Opaque
stringData:
  # Replace before deploying to EKS — use AWS Secrets Manager or External Secrets in production
  POSTGRES_PASSWORD: CHANGE_ME
  DATABASE_URL: postgresql://tenantflow:CHANGE_ME@tenantflow-postgres:5432/tenantflow
  JWT_SECRET: CHANGE_ME_USE_64_CHAR_RANDOM_STRING_IN_PRODUCTION
