apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tenantflow-postgres-pvc
  namespace: tenantflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenantflow-postgres
  namespace: tenantflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenantflow-postgres
  template:
    metadata:
      labels:
        app: tenantflow-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: tenantflow
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenantflow-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: tenantflow
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tenantflow-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: tenantflow-postgres
  namespace: tenantflow
spec:
  selector:
    app: tenantflow-postgres
  ports:
    - port: 5432
      targetPort: 5432
