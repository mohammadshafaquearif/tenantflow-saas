services:
  postgres:
    image: postgres:16-alpine
    container_name: tenantflow-postgres
    environment:
      POSTGRES_USER: tenantflow
      POSTGRES_PASSWORD: tenantflow_secret
      POSTGRES_DB: tenantflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantflow -d tenantflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tenantflow-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://tenantflow:tenantflow_secret@postgres:5432/tenantflow
      JWT_SECRET: dev-docker-jwt-secret-change-in-production-64chars
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
